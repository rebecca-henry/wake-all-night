<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#110c15">
<title>A Wake All Night</title>
<style>
/* "Halloween Spooky" (free for personal use), served from halloween-spooky.otf next to index.html. */
@font-face{font-family:"Halloween Spooky";src:url("fonts/halloween-spooky.otf") format("opentype");font-display:swap}
/* "Aveline Eleganza" (demo font, personal use) for all the details. The demo version has no real numbers,
   so digits are left out here and come from Halloween Spooky instead. */
@font-face{font-family:"Aveline Eleganza";src:url("fonts/aveline-eleganza.otf") format("opentype");font-display:swap;
  unicode-range:U+0000-002F, U+003A-00B2, U+00B4-00B8, U+00BA-00BB, U+00BF-DFFF, U+E001-E003, U+E005-E216, U+E218-FFFF}
/* Candlelit mood board: one dark look by design (it's a party at night). Full-bleed photo banners, masonry pins, blackletter headings, book serif text. */
:root{
  --bg:#110c15; --surface:#1b1420; --raised:#251c2c; --ink:#f0e7f1; --muted:#a596ad; --line:#382c41;
  --gold:#e3b55f; --gold-ink:#1d1409; --plum:#c58fbe; --trick:#ec8296; --ok:#83c99a;
  --display:"Halloween Spooky", Georgia, serif;
  --title:"Halloween Spooky", Georgia, serif;
  --body:"Aveline Eleganza", "Halloween Spooky", Georgia, serif;
  --mono:"Halloween Spooky", Georgia, serif;
  --nav-h:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:21px/1.55 var(--body);letter-spacing:.015em;min-height:100vh}
/* Backdrop: big, soft, out-of-focus purple and orange lights drifting slowly. */
#bokeh{display:none;position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg)}
#bokeh i{position:absolute;border-radius:50%;filter:blur(30px);animation:drift 60s ease-in-out infinite alternate}
#bokeh i:nth-child(1){width:130vmax;height:130vmax;left:-55vmax;top:-45vmax;background:radial-gradient(circle, rgba(52,40,140,.55) 0%, rgba(52,40,140,0) 65%)}
#bokeh i:nth-child(2){width:110vmax;height:110vmax;right:-55vmax;top:5vh;background:radial-gradient(circle, rgba(34,46,120,.5) 0%, rgba(34,46,120,0) 65%);animation-duration:75s;animation-delay:-20s}
#bokeh i:nth-child(3){width:90vmax;height:90vmax;left:-40vmax;top:55vh;background:radial-gradient(circle, rgba(70,36,120,.45) 0%, rgba(70,36,120,0) 65%);animation-duration:68s;animation-delay:-35s}
#bokeh i:nth-child(4){width:95vmax;height:95vmax;right:-40vmax;top:55vh;background:radial-gradient(circle, rgba(196,92,28,.42) 0%, rgba(196,92,28,0) 65%);animation-duration:82s;animation-delay:-10s}
#bokeh i:nth-child(5){width:75vmax;height:75vmax;right:-35vmax;top:-20vmax;background:radial-gradient(circle, rgba(214,110,36,.32) 0%, rgba(214,110,36,0) 65%);animation-duration:70s;animation-delay:-25s}
#bokeh i:nth-child(6){width:65vmax;height:65vmax;left:-25vmax;top:120vh;background:radial-gradient(circle, rgba(180,80,30,.3) 0%, rgba(180,80,30,0) 65%);animation-duration:66s;animation-delay:-40s}
body.glow #bokeh{display:block}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(3vmax,-2vmax) scale(1.04)}100%{transform:translate(-2vmax,3vmax) scale(.98)}}
@media (prefers-reduced-motion:reduce){#bokeh i{animation:none}}
h1,h2,h3{font-family:var(--title);font-weight:500;margin:0;text-wrap:balance;line-height:1.05;letter-spacing:.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:var(--gold)}

.page{max-width:600px;margin:0 auto;padding-inline:20px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px));display:grid;gap:40px}
.page.bare{padding-bottom:40px}
.eyebrow{font-family:var(--body);font-size:18px;font-weight:500;color:var(--gold)}
.muted{color:var(--muted)}
.small{font-size:18px;line-height:1.5}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:4;height:38px}
.topbar .brand{font-family:var(--title);font-size:24px}
.chip{font-family:var(--body);font-size:13px;font-weight:600;border:0;border-bottom:1px solid currentColor;border-radius:0;padding:0 0 1px;color:var(--muted);white-space:nowrap}
.chip.gold{color:var(--gold)}
.chip.trick{color:var(--trick)}
.chip:empty{display:none}

section.block{display:grid;gap:20px}
.block > h2{font-size:34px}
.block-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.block-head h2{font-size:34px}
.card{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:26px 0 0;display:grid;gap:20px;min-width:0}
.card.quiet{background:transparent}
.notice{border:0;padding:0;color:var(--muted);font-size:19px;line-height:1.55}
.notice.gold{color:var(--gold)}

.hero{display:grid;gap:8px;text-align:center;padding-block:10px 4px}
.hero h1{font-size:clamp(48px,14vw,76px);font-weight:600}
.hero .sub{font-family:var(--body);font-size:18px;color:var(--muted)}

.dst{display:grid;gap:4px;text-align:center;padding:22px 16px;border-block:1px solid var(--line)}
.dst .big{font-family:var(--display);font-weight:500;font-size:clamp(40px,12vw,56px);color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
.dst .lbl{font-size:17px;color:var(--muted)}

.next{display:grid;gap:4px}
.next .when{font-family:var(--mono);font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}
.next h3{font-size:30px}

.stats{display:grid;border-block:1px solid var(--line)}
.stat{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:13px 0;display:grid;grid-template-columns:7.5rem minmax(0,1fr) auto;gap:12px;align-items:baseline;text-align:left;cursor:pointer;min-width:0;color:var(--ink);font-size:17px}
.stat:first-child{border-top:0}
.stat span{color:var(--muted);font-size:15px}
.stat small{font-size:17px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;order:1}
.stat b{font-family:var(--mono);font-weight:400;font-size:17px;color:var(--gold);order:2}
.stat:hover small{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px}

.sched{list-style:none;margin:0;padding:0;display:grid}
.sched li{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.sched li:first-child{border-top:0}
.sched .t{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sched li.past{opacity:.45}
.sched li.now .t,.sched li.now .what{color:var(--gold)}
.sched li.now .what::after{content:"now";margin-left:8px;font-size:13px;font-weight:600;border-bottom:1px solid var(--gold)}

label.fld{display:grid;gap:5px;min-width:0}
label.fld > span{font-size:17px;font-weight:500;color:var(--muted)}
input[type=text],input[type=password],input[type=search],input[type=datetime-local],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:12px 13px;font-size:19px;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}

/* Buttons are printed memorial cards: square corners, a fine inner rule, no glow. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:transparent;border-radius:0;padding:10px 18px;font-family:var(--body);font-weight:600;font-size:18px;letter-spacing:.01em;cursor:pointer;text-decoration:none;color:var(--ink);min-height:44px;box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 4px var(--line);transition:background-color .15s,color .15s}
.btn:hover{background:var(--raised)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg);box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 4px var(--bg)}
.btn.primary:hover{background:var(--gold);border-color:var(--gold);box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 0 4px var(--bg)}
.btn.danger{border-color:var(--trick);color:var(--trick);box-shadow:none}
.btn.ghost{border-color:var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--ink)}
.btn.small{min-height:40px;padding:7px 14px;font-size:16px;box-shadow:none}
.btn.primary.small{box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 3px var(--bg)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px;cursor:pointer;font-size:15px}

.avatar{width:56px;height:56px;border-radius:2px;object-fit:cover;background:var(--raised);display:grid;place-items:center;font-family:var(--display);font-size:24px;color:var(--muted);flex:none;overflow:hidden}
.avatar.lg{width:100%;height:auto;aspect-ratio:4/5;max-width:100%;font-size:48px}
.avatar img{width:100%;height:100%;object-fit:cover}
.me-entry{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:start}
.me-entry .avatar{width:110px;height:138px}

.rank-list{display:grid;border-bottom:1px solid var(--line)}
.entry{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:10px 0;text-align:left;cursor:pointer;width:100%;min-height:76px;color:var(--ink)}
.entry .nm{font-weight:600;overflow-wrap:anywhere}
.entry .tt{font-size:15px;color:var(--muted);overflow-wrap:anywhere}
.entry .badge{font-family:var(--mono);font-size:14px;border:1px solid var(--line);border-radius:0;padding:3px 9px;color:var(--muted);white-space:nowrap}
.entry.picked .nm{color:var(--gold)}
.entry.picked .badge{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.entry.own{opacity:.4;cursor:not-allowed}
.ballot-bar{display:grid;gap:10px;position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--gold);padding:12px 0 14px;z-index:3}
.ballot-bar .picks{font-size:17px;color:var(--muted)}
.ballot-bar .picks b{color:var(--ink)}

.team-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.team-row:first-child{border-top:0}
.team-row .nm{font-weight:700}

.hunt-count{display:grid;gap:2px;text-align:center;padding:8px 0}
.hunt-count .big{font-family:var(--display);font-weight:500;font-size:72px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.pips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:14px}
.pips i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--gold)}
.pips i.found{background:var(--gold)}
.board{list-style:none;margin:0;padding:0;display:grid;counter-reset:b}
.board li{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline;counter-increment:b}
.board li:first-child{border-top:0}
.board li::before{content:counter(b);font-family:var(--mono);color:var(--muted);font-size:13px}
.board li.me{color:var(--gold)}
.board .pts{font-family:var(--mono);font-variant-numeric:tabular-nums}
.finds{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.finds li{display:grid;grid-template-columns:3.4rem minmax(0,1fr);gap:10px;align-items:baseline}
.finds .pts{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pts.neg{color:var(--trick)}
.pts.pos{color:var(--gold)}



.winners{display:grid;gap:14px}
.win{display:grid;gap:8px}
.win h3{font-size:28px}
.podium{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.podium li{display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:10px;align-items:center}
.podium .place{font-family:var(--mono);font-size:12px;color:var(--muted)}
.podium li:first-child .place{color:var(--gold)}
.podium li:first-child .who{font-weight:600}
.podium .pts{font-family:var(--mono);font-size:13px;color:var(--muted)}

nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(17,12,21,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(8px)}
nav.tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabbar button{background:none;border:0;border-top:2px solid transparent;display:grid;justify-items:center;align-content:center;gap:3px;font-size:12px;color:var(--muted);cursor:pointer}
nav.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabbar button[aria-current="page"]{color:var(--gold);border-top-color:var(--gold)}

.overlay{background:var(--bg)}
.overlay .page{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.overlay-top{display:flex;justify-content:space-between;align-items:center;gap:10px}

.viewer{position:fixed;inset:0;height:100vh;height:100dvh;z-index:50;background:#08050a;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.viewer .stage{position:relative;min-height:0;margin-top:10px}
.viewer .stage img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:4px}
.viewer .meta{display:grid;gap:8px;padding-top:12px;position:relative;z-index:1;background:rgba(8,5,10,.97)}

.reveal{position:fixed;inset:0;z-index:60;background:rgba(8,5,10,.96);display:grid;place-items:center;padding:24px 16px}
.reveal .box{max-width:420px;width:100%;text-align:center;display:grid;gap:14px;justify-items:center}
.reveal .word{font-family:var(--display);font-weight:600;font-size:clamp(64px,20vw,100px);line-height:1}
.reveal .word.treat{color:var(--gold)}
.reveal .word.trick{color:var(--trick)}
.reveal .pts{font-family:var(--mono);font-weight:700;font-size:30px}
.reveal .msg{font-family:var(--body);font-size:20px}
.reveal .door{width:120px;height:170px;border:2px solid var(--gold);border-radius:60px 60px 4px 4px;position:relative;animation:knock .9s ease-in-out infinite}
.reveal .door::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border-radius:50%;background:var(--gold)}
@keyframes knock{0%,100%{transform:rotate(0)}20%{transform:rotate(-2deg)}40%{transform:rotate(2deg)}60%{transform:rotate(-1deg)}}
.reveal .pop{animation:pop .45s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:0;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.4)}
.toast.err{background:var(--trick);color:#1b0a0e}

.htabs{display:flex;gap:18px;overflow-x:auto;border-bottom:1px solid var(--line)}
.htabs button{flex:none;border:0;border-bottom:2px solid transparent;background:none;border-radius:0;padding:8px 0;margin-bottom:-1px;font-size:15px;color:var(--muted);cursor:pointer}
.htabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:0}
.seg button{border:0;border-left:1px solid var(--ink);background:transparent;border-radius:0;padding:8px 14px;font-size:14px;cursor:pointer;min-height:38px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line)}
.ctl:first-child{border-top:0}
.code-row{display:grid;gap:8px;padding:16px 0 0;border:0;border-top:1px solid var(--line);border-radius:0;background:none}
.code-row .head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.code-row .grid4{display:grid;grid-template-columns:minmax(0,1fr) 6rem;gap:8px}
.sch-row{display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr) auto;gap:8px;align-items:center}
.x{border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;padding:4px 8px;min-height:40px}
.mono{font-family:var(--mono)}

/* ---- mood board ---- */
/* Banners fill the top 3/8 of the screen, running up under the top bar to the top edge.
   As the page scrolls, --p goes 0 to 1: the title lifts and fades while the photo drifts and swells. */
.banner{--p:0;position:relative;margin-inline:-20px;margin-top:calc(-84px - env(safe-area-inset-top,0px));min-height:max(300px, 37.5vh);min-height:max(300px, 37.5svh);display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}
.banner::before{content:"";position:absolute;inset:0 0 auto;height:140px;background:linear-gradient(180deg, rgba(10,6,12,.7), transparent);z-index:1;pointer-events:none}
.banner > img,.banner > video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.8) brightness(.72);transform-origin:50% 0;transform:translateY(calc(var(--p) * 18%)) scale(calc(1 + var(--p) * .14));opacity:calc(1 - var(--p) * .55);will-change:transform}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(17,12,21,0) 40%, rgba(17,12,21,.5) 75%, var(--bg) 100%);pointer-events:none}
.banner .over{position:relative;flex:1;padding:calc(102px + env(safe-area-inset-top,0px)) 20px 18px;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
  transform:translateY(calc(var(--p) * -90px)) scale(calc(1 - var(--p) * .1));opacity:calc(1 - var(--p) * 1.6);will-change:transform,opacity}
.banner h1{font-size:clamp(54px,16vw,96px);font-weight:600;line-height:.92}
/* Header titles: stretched wide, worn and rough like old letterpress, slightly see-through so the photo shows in the ink. */
.banner .fit{font-family:var(--title);font-style:italic;width:100%;font-weight:600;line-height:1.02;letter-spacing:.01em;padding-block:.3em .16em;color:#efe6e2}
.banner .fit .ln{display:block;white-space:nowrap;width:max-content;margin-inline:auto;padding-inline:.1em;transform:scaleY(1.32);transform-origin:50% 62%}
.banner h2{font-size:clamp(52px,15vw,84px);font-weight:600;line-height:.95}
.banner .sub{font-size:26px;line-height:1.3;color:var(--ink);opacity:.9}
.banner .row{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.banner.home .over{justify-content:center}
.banner.home .over > .eyebrow{position:static;margin-bottom:10px}
@media (prefers-reduced-motion:reduce){.banner > img,.banner .over{transform:none!important;opacity:1!important}}


.masonry{columns:2;column-gap:12px}
@media (min-width:560px){.masonry{columns:3}}
.pin{display:block;width:100%;break-inside:avoid;margin:0 0 18px;background:none;border:0;padding:0;text-align:left;color:var(--ink);cursor:default}
button.pin,a.pin{cursor:pointer}
a.pin{text-decoration:none;color:var(--ink)}
.pin .pimg{display:block;position:relative;border-radius:6px;overflow:hidden;background:var(--surface)}
.pin .pimg img{display:block;width:100%;height:auto}
.pin .pimg img:not([src]){aspect-ratio:3/4}
.pin .pimg.tall img{aspect-ratio:3/4;object-fit:cover}
.pin .pimg.sq img{aspect-ratio:1;object-fit:cover}
.pin .pimg.wide img{aspect-ratio:4/3;object-fit:cover}
.pin .pimg.mood img{filter:brightness(.9)}
.pin.mood-act .pimg img{filter:brightness(.72)}
.pin .ov{position:absolute;left:0;right:0;bottom:0;grid-template-columns:minmax(0,1fr);padding:40px 12px 12px;background:linear-gradient(180deg, transparent, rgba(10,6,12,.85));display:grid;gap:2px}
.pin .ov .k{font-size:18px;color:var(--gold)}
.pin .ov .v{display:block;font-family:var(--display);font-size:31px;line-height:1;font-weight:500}
.pin .ov .v.num{font-size:56px}

<script>
(function(){

var CFG = window.WAKE_CONFIG || {};
var HOST = CFG.hostName || 'the host';
var DST_END = Date.UTC(2026, 10, 1, 6, 0, 0); /* 2:00 a.m. EDT, Sunday Nov 1 2026 */
var TZ = 'America/Toronto';
var app = document.getElementById('app');

/* ---------- small utilities ---------- */
var store = {
  get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set: function(k, v){ try { localStorage.setItem(k, v); } catch(e){} },

function fmtTime(ms){ return new Date(ms).toLocaleTimeString('en-CA', {timeZone: TZ, hour: 'numeric', minute: '2-digit'}).replace(/\./g, '').replace(/\s?(am|pm)/i, function(m){ return ' ' + m.trim().toLowerCase(); }); }
function fmtDur(ms, withSecs){
  if (ms <= 0) return '0m';
  var s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;

/* ---------- state ---------- */
var S = {
  pass: store.get('wake-pass'),
  token: store.get('wake-token'),

var ERR = {

  bad_ballot: 'Pick one to three different entries.',
  already_paired: 'They’re already paired with someone else.',
  bad_partner: 'Pick someone from the list.',
  need_message: 'Write a message first.',
  guest_pass_short: 'The guest passcode needs at least 4 characters.',
  host_pass_short: 'The host passcode needs at least 6 characters.',
  pass_same: 'Use different passcodes for guests and for you.',
  message_too_long: 'Keep it to 60 characters.',
  message_limit: 'You\u2019ve posted the maximum of 40 messages.',
  already_grouped: 'They\u2019re already in another costume group.',
  other_team: 'They\u2019re already on another team.',
  bad_team: 'That team no longer exists.',
  no_team: 'Join a team first.',
  bad_image: 'That photo couldn’t be used. Try a different one.',
  gif_too_big: 'That GIF is too big. Try one under 1 MB.',
  photo_limit: 'You’ve reached the 80 photo limit.',
  not_yours: 'You can only remove photos you uploaded.',

  network: 'Can’t reach the party server. Check your connection and try again.'
};
function AppError(code, raw){ this.code = code; this.message = ERR[code] || ('Something went wrong' + (raw ? ' (' + String(raw).slice(0, 90) + ')' : '') + '. Try again.'); }

/* ---------- server ---------- */
var sb = null;
function configured(){ return CFG.supabaseUrl && CFG.supabaseUrl.indexOf('PASTE') === -1 && CFG.supabaseKey && CFG.supabaseKey.indexOf('PASTE') === -1; }

function rpc(fn, args){
  if (!sb) return Promise.reject(new AppError('network'));
  return sb.rpc(fn, args || {}).then(function(res){
    if (res.error) {
      var msg = String(res.error.message || '');
      var code = Object.keys(ERR).concat(['not_joined']).find(function(k){ return msg.indexOf(k) > -1; });
      if (!code && /fetch|network|Failed|timeout/i.test(msg)) code = 'network';
      if (code === 'bad_passcode') { forgetPass(); }
      if (code === 'not_joined') { forgetMe(); render(true); }
      throw new AppError(code || 'unknown', msg);
    }
    return res.data;
  }, function(){ throw new AppError('network'); });
}

function forgetPass(){ S.pass = null; S.isHost = false; store.del('wake-pass'); S.state = null; render(true); }
function forgetMe(){ S.token = null; store.del('wake-token'); S.ballots = {costume: null, drink: null}; if (S.state) S.state.me = null; }

var refreshing = false;
function refresh(){
  if (!S.pass || refreshing) return Promise.resolve();
  refreshing = true;
  return rpc('party_state', {p_pass: S.pass, p_token: S.token || null}).then(function(st){
    var sig = JSON.stringify(st, function(k, v){ return k === 'now' ? undefined : v; });
    var same = sig === S.lastSig; S.lastSig = sig;
    S.state = st;
    S.clockOffset = Date.parse(st.now) - Date.now();
    if (S.token && !st.me) forgetMe();
    if (st.me) {
      if (S.ballots.costume === null) S.ballots.costume = (st.my_costume_vote || []).slice();
      if (S.ballots.drink === null) S.ballots.drink = (st.my_drink_vote || []).slice();

    if (!same) render();
    processPending();
  }).catch(function(e){
    if (e.code === 'network' && !S.state) S.fatal = ERR.network;
    render();
  }).then(function(){ refreshing = false; });
}

function refreshHost(){
  if (!S.isHost) return Promise.resolve();
  return rpc('host_state', {p_pass: S.pass}).then(function(h){ S.host = h; render(); }).catch(function(e){ toast(e.message, true); });

var imgCache = new Map(), imgWant = new Map(), imgTimer = null;
function imgKey(kind, id, v, size){ return kind + ':' + id + ':' + (v || '') + ':' + size; }

function loadImages(){
  var groups = {};

  imgWant.clear();

    var parts = g.split('|'), list = groups[g], per = parts[1] === 'full' ? 4 : 30;
    for (var i = 0; i < list.length; i += per) (function(chunk){
      rpc('party_images', {p_pass: S.pass, p_kind: parts[0], p_ids: chunk.map(function(c){ return c.id; }), p_size: parts[1]}).then(function(map){
        chunk.forEach(function(c){
          var src = map[String(c.id)];
          if (!src) return;
          imgCache.set(c.k, src);
          document.querySelectorAll('img[data-img="' + c.k + '"]').forEach(function(el){ el.src = src; });
        });
      }).catch(function(){});
    })(list.slice(i, i + per));
  });

function shrink(file, maxDim, quality, maxLen){
  function draw(src, w0, h0){
    var scale = Math.min(1, maxDim / Math.max(w0, h0));
    var tries = 0;
    while (true) {
      var w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var ctx = c.getContext('2d'); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h); ctx.drawImage(src, 0, 0, w, h);
      var q = quality, url = c.toDataURL('image/jpeg', q);
      while (url.length > maxLen && q > 0.45) { q -= 0.08; url = c.toDataURL('image/jpeg', q); }
      if (url.length <= maxLen || tries > 3) return url;
      scale *= 0.75; tries++;
    }
  }
  var bitmap = window.createImageBitmap ? createImageBitmap(file, {imageOrientation: 'from-image'}).catch(function(){ return null; }) : Promise.resolve(null);
  return bitmap.then(function(bmp){
    if (bmp) return draw(bmp, bmp.width, bmp.height);
    return new Promise(function(res, rej){
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function(){ URL.revokeObjectURL(url); res(draw(im, im.naturalWidth, im.naturalHeight)); };
      im.onerror = function(){ URL.revokeObjectURL(url); rej(new AppError('bad_image')); };
      im.src = url;
    });
  });
}
function dataUrlToBlob(d){
  var parts = d.split(','), mime = (parts[0].match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
  var bin = atob(parts[1]), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mime});
}
function saveBlob(blob, name){
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

/* On GitHub Pages, look in the repository's gifs folder and add any new GIFs or pictures to the tile rotation.

(function findGifs(){
  var host = location.hostname, m = host.match(/^([^.]+)\.github\.io$/i);
  if (!m) return;
  var seg = location.pathname.split('/').filter(Boolean)[0];
  var repo = seg && !/\.html?$/i.test(seg) ? seg : host;
  var key = 'wake-gifs-' + repo, cached = null;
  try { cached = JSON.parse(store.get(key) || 'null'); } catch(e){}
  var headers = [MOOD.costumes, MOOD.drinks, MOOD.hunt, MOOD.photos, MOOD.hero];
  function use(list){
    var extra = list.filter(function(p){ return MOOD.board.indexOf(p) === -1 && headers.indexOf(p) === -1; });
    if (!extra.length) return;
    MOOD.board = MOOD.board.concat(extra);
    MOOD.empty = MOOD.empty.concat(extra);
  }
  if (cached && Date.now() - cached.at < 3600000) { use(cached.list); return; }
  if (!window.fetch) return;
  fetch('https://api.github.com/repos/' + m[1] + '/' + repo + '/contents/gifs').then(function(r){ return r.ok ? r.json() : []; }).then(function(items){
    if (!Array.isArray(items)) return;
    var list = items.filter(function(it){ return it.type === 'file' && /\.(gif|jpe?g|png|webp)$/i.test(it.name); }).map(function(it){ return 'gifs/' + it.name; });
    store.set(key, JSON.stringify({at: Date.now(), list: list}));
    use(list);
  }).catch(function(){});
})();

function fitTileText(){
  app.querySelectorAll('.stagger .pin .ov .v').forEach(function(v){
    v.style.fontSize = '';

    var words = v.textContent.split(/\s+/), ov = v.parentElement, ocs = getComputedStyle(ov);
    var room = ov.clientWidth - parseFloat(ocs.paddingLeft) - parseFloat(ocs.paddingRight);
    while (guard++ < 30 && size > 16) {

      v.appendChild(probe);

function fitTitles(){

    var lines = t.querySelectorAll('.ln'), par = t.parentElement, cs = getComputedStyle(par);

var scanner = null;

/* Daylight Saving Time countdown: big, spread out, with D H M units. */
function dstParts(ms){
  var mins = Math.max(0, Math.floor(ms / 60000));
  return [[Math.floor(mins / 1440), 'D'], [Math.floor(mins % 1440 / 60), 'H'], [mins % 60, 'M']].map(function(p){
    return '<span class="u"><b>' + p[0] + '</b><small>' + p[1] + '</small></span>';
  }).join('');
}
function dstHTML(ms){
  if (ms <= 0) return '<div class="dst"><span class="cdp done"><span class="u"><b>1</b><small>H</small></span></span><span class="lbl">Daylight Saving Time has passed. It left everyone an extra hour.</span></div>';
  return '<div class="dst"><span class="cdp" data-cdp="' + DST_END + '">' + dstParts(ms) + '</span><span class="lbl">Until the clocks fall back</span></div>';
}

function staggered(items, head){

  return '<div class="stagger"><div class="col">' + (head || '') + l.join('') + '</div><div class="col">' + r.join('') + '</div></div>';
}
function actionPin(tab, img, k, v, numeric, cls){

}
function linkPin(attrs, img, k, v, cls){
  var tag = attrs.indexOf('href=') > -1 ? 'a' : 'button';
  return '<' + tag + ' class="pin mood-act" ' + attrs + '><span class="pimg ' + (cls || 'tall') + '">' + img +
    '<span class="ov"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + '</span></span></span></' + tag + '>';
}
/* Rotating photo tiles: every few seconds one plain photo tile cross-fades to another mood photo,
   or to a party photo once guests start adding them. What each tile shows survives page refreshes. */
var rotation = {};
function rotationPool(){
  var pool = MOOD.board.concat(MOOD.empty);
  imgCache.forEach(function(src, k){ if (k.indexOf('photo:') === 0 && /:thumb$/.test(k)) pool.push(src); });
  ((S.state && S.state.messages) || []).slice(0, 30).forEach(function(m){ pool.push('msg:' + m.id); pool.push('msg:' + m.id); });
  return pool;
}
function noteFace(id, extra){
  var m = ((S.state && S.state.messages) || []).find(function(x){ return 'msg:' + x.id === id; });
  if (!m) return null;
  return '<span class="noteface' + (extra ? ' ' + extra : '') + '" data-src="' + id + '"><span class="nq">\u201c' + esc(m.body) + '\u201d</span><span class="nw">' + esc(shortName(guestsById()[m.guest_id])) + '</span></span>';
}
function rotateTile(){
  if (document.visibilityState !== 'visible' || S.tab !== 'home' || S.overlay || S.viewer != null || S.reveal) return;
  var tiles = Array.prototype.slice.call(app.querySelectorAll('.stagger .pin.mood-only[data-slot]'));
  var visible = tiles.filter(function(t){ var r = t.getBoundingClientRect(); return r.bottom > 0 && r.top < window.innerHeight; });
  if (!visible.length) return;
  var tile = visible[Math.floor(Math.random() * visible.length)], slot = tile.getAttribute('data-slot');
  var box = tile.querySelector('.pimg'), old = box.lastElementChild;
  var showing = Array.prototype.map.call(app.querySelectorAll('.stagger .pin.mood-only img, .stagger .pin.mood-only .noteface'), function(i){ return i.getAttribute('data-src') || i.getAttribute('src'); });
  var pool = rotationPool().filter(function(v){ return showing.indexOf(/^(data:|msg:)/.test(v) ? v : moodUrl(v, 700)) === -1; });
  if (!pool.length) return;
  var pick = pool[Math.floor(Math.random() * pool.length)];
  if (pick.indexOf('msg:') === 0) {
    var html = noteFace(pick, 'rot-in'); if (!html) return;
    box.insertAdjacentHTML('beforeend', html);
    var face = box.lastElementChild;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ face.classList.add('on'); }); });
    setTimeout(function(){ if (old && old.parentNode && box.contains(face)) { old.remove(); face.classList.remove('rot-in', 'on'); } }, 1300);
    rotation[slot] = pick;
    return;
  }
  var img = new Image();
  img.alt = ''; img.className = 'rot-in'; img.setAttribute('data-mood', '');
  img.onload = function(){
    box.appendChild(img);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ img.classList.add('on'); }); });
    setTimeout(function(){ if (old && old.parentNode && box.contains(img)) { old.remove(); img.classList.remove('rot-in', 'on'); } }, 1300);
    rotation[slot] = pick;
  };
  img.src = /^data:/.test(pick) ? pick : moodUrl(pick, 700);
}
if (!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) setInterval(rotateTile, 3500);

function moodPin(id, cls){ return '<div class="pin mood-only" aria-hidden="true"><span class="pimg mood ' + (cls || '') + '">' + moodImg(id, 700) + '</span></div>'; }
function boardHTML(me, team, h){
  var gm = guestsById(), mood = MOOD.board.slice(), m = 0;
  function nextMood(cls){
    if (m >= mood.length) return '';
    var slot = m++, cur = rotation[slot] || mood[slot];
    var face = /^msg:/.test(cur) ? noteFace(cur) : null;
    if (/^msg:/.test(cur) && !face) cur = mood[slot];
    return '<div class="pin mood-only" aria-hidden="true" data-slot="' + slot + '"><span class="pimg mood ' + (cls || '') + '">' +
      (face || (/^data:/.test(cur) ? '<img data-mood src="' + cur + '" alt="">' : moodImg(cur, 700))) + '</span></div>';
  }
  var cw = winnerOf('costume'), dw = winnerOf('drinks');
  function winTile(tab, w, label, fallbackImg, cls){
    return actionPin(tab, w.img || moodImg(fallbackImg, 700), label, w.none ? 'No winner' : w.names, false, w.img ? '' : cls);
  }
  var acts = [
    actionPin('costumes', me.photo_v ? imgHTML('costume', me.id, me.photo_v, 'thumb', 'Your costume', me.name) : moodImg(MOOD.pinCostume, 700),
              'Costume Contest', (me.costume_title || me.photo_v) ? (cfg('costume_voting') === 'open' ? 'Vote' : (me.costume_title || 'Your costume')) : 'Add your costume', false, me.photo_v ? '' : 'tall'),
    actionPin('drinks', team && team.photo_v ? imgHTML('team', team.id, team.photo_v, 'thumb', team.name, team.name) : moodImg(MOOD.pinDrink, 700),
              'Drink Making Contest', team ? (cfg('drink_voting') === 'open' ? 'Vote' : (team.drink_name || team.name)) : 'Join a team', false, team && team.photo_v ? '' : 'sq'),
    huntOver() ? actionPin('hunt', moodImg(MOOD.pinHunt, 700), 'Scavenger Hunt', 'Hunt over', false, 'wide')
           : actionPin('hunt', moodImg(MOOD.pinHunt, 700), 'Codes still hidden', String(h.total - h.found), true, 'wide')
  ];
  if (cw) acts[0] = winTile('costumes', cw, 'Costume Contest Winner', MOOD.pinCostume, 'tall');
  if (dw) acts[1] = winTile('drinks', dw, 'Drink Making Contest Winner', MOOD.pinDrink, 'sq');
  var people = entries().filter(function(e){ return e.photo; }).slice(-6).reverse().map(function(e){
    return '<button class="pin" data-act="tab" data-tab="costumes"><span class="pimg">' + imgHTML('costume', e.photo.id, e.photo.photo_v, 'thumb', e.names, e.names) +
      '<span class="ov"><span class="k">' + esc(e.title || 'Costume') + '</span><span class="v">' + esc(e.names) + '</span></span></span></button>';
  });
  var snaps = S.state.photos.slice(0, 6).map(function(p){
    return '<button class="pin" data-act="view" data-id="' + p.id + '"><span class="pimg">' + imgHTML('photo', p.id, 'p', 'thumb', p.caption || 'Party photo', '?') +
      '<span class="ov"><span class="k">' + esc(p.caption || 'Photo') + '</span><span class="v">' + esc(shortName(gm[p.guest_id])) + '</span></span></span></button>';
  });
  var playlist = cfg('playlist_url');
  var music = playlist && /^https?:\/\//.test(playlist)
    ? linkPin('href="' + esc(playlist) + '" target="_blank" rel="noopener"', moodImg(MOOD.pinPlaylist, 700), 'Tonight\u2019s music', 'Playlist', 'tall')
    : linkPin('data-act="no-playlist"', moodImg(MOOD.pinPlaylist, 700), 'Tonight\u2019s music', 'Playlist', 'tall');
  var notes = linkPin('data-act="board"', moodImg(MOOD.pinBoard, 700), 'Leave a note', 'Message Board', 'tall');
  var pingpong = '<div class="pin sign"><span class="signbox"><span class="sv">Ping Pong Upstairs!</span><span class="sk">Must wear shoes.<br>No smoking or flames.</span></span></div>';
  var news = (cfg('alerts') || []).filter(function(x){ return x && x.text; }).map(function(x){
    var len = x.text.length, size = len < 25 ? 34 : len < 50 ? 27 : len < 90 ? 22 : 18;
    return '<div class="pin sign news"><span class="signbox"><span class="sk">Announcement<br><span style="white-space:nowrap">' + fmtTime(Date.parse(x.at)) + '</span></span>' +
      '<span class="sv" style="font-size:' + size + 'px">' + esc(x.text) + '</span></span></div>';
  });
  var out = news.concat([acts[0], nextMood(), acts[1], nextMood(), notes, acts[2], pingpong, music, nextMood(), nextMood()]);
  var extra = people.concat(snaps);
  extra.forEach(function(x, i){ out.push(x); if (i % 3 === 2) out.push(nextMood()); });
  if (out.filter(Boolean).length % 2) out.push(nextMood());
  return staggered(out, fitTitle('h2', ['Tonight']));
}

function rankerHTML(kind, items, ownIds, open){
  var ballot = S.ballots[kind] || [];

  if (!items.length) return '<div class="notice">No entries yet.</div>';
  var out = '<div class="masonry">' + items.map(function(it, i){

      : '<span class="pimg mood tall">' + moodImg(MOOD.empty[i % MOOD.empty.length], 600) + '<span class="empty-name">' + esc(it.name) + '</span>';
    var tag = own ? '<span class="own-note">' + (kind === 'costume' ? 'Can\u2019t vote for yourself' : 'Can\u2019t vote for your own team') + '</span>' : pos > -1 ? '<span class="rk">' + (pos + 1) + '</span>' : '';
    return '<button class="pin' + (own ? ' own' : '') + (pos > -1 ? ' picked' : '') + '" data-act="rank" data-kind="' + kind + '" data-id="' + it.id + '"' + (own || !open ? ' disabled' : '') + ' aria-pressed="' + (pos > -1) + '" aria-label="' + esc(it.name + (it.sub ? ', ' + it.sub : '')) + '">' +

  }).join('') + '</div>';
  if (open) {
    var names = ballot.map(function(id, i){ var it = items.find(function(x){ return x.id === id; }); return '<b>' + (i + 1) + '.</b> ' + esc(it ? it.name : '?'); });
    out += '<div class="ballot-bar"><span class="picks">' + (names.length ? names.join(' · ') : 'Tap your favourite first. Pick one, two or three.') + '</span>' +
      '<button class="btn primary" data-act="cast" data-kind="' + kind + '"' + (!ballot.length || same || S.busy['cast-' + kind] ? ' disabled' : '') + '>' +
      (same && saved.length ? 'Your vote is in. Tap entries to change it.' : saved.length ? 'Update my vote' : 'Cast my vote') + '</button></div>';

  return out;
}

/* ----- hunt ----- */
function huntView(){
  var h = S.state.hunt, me = S.state.me, open = cfg('hunt') === 'open' && !ended();
  var over = huntOver();
  var left = h.total - h.found, pips = '';
  for (var i = 0; i < h.total; i++) pips += '<i class="' + (i < h.found ? 'found' : '') + '"></i>';
  var out = banner('hunt', '<div class="row">' + fitTitle('h2', ['Trick', 'or Treat']) + '<span class="chip' + (open && !over ? ' gold' : '') + '">' + (over ? 'Hunt over' : open ? 'Hunt is on' : 'Not started') + '</span></div>') + '<div class="rule"></div><section class="block">';
  if (!open && !over) out += '<div class="notice">' + TH('hunt_wait') + '</div>';
  if (over) out += '<div class="notice gold"><b>The hunt is over.</b>' + (h.over ? ' Every code has been found.' : '') + '</div>';
  out += '<div class="hunt-count"><span class="big">' + left + '</span><span class="muted">of ' + h.total + ' codes still hidden</span><div class="pips" aria-hidden="true">' + pips + '</div></div>';
  if (over) out += leaderboardHTML(h, me);
  out += '<div class="card"><div class="block-head"><h3>Your Haul</h3><span class="mono" style="font-size:22px;color:var(--gold)">' + plural(myPoints(), 'treat') + '</span></div>' +
    hauls(h, over) + '</div>';
  if (!over) out += '<div class="card quiet"><h3>How It Works</h3><ul class="muted small" style="margin:0;padding-left:20px;display:grid;gap:12px">' +
    T('hunt_rules').split(/\n+/).map(function(l){ return l.trim(); }).filter(Boolean).map(function(l){ return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>' +
    '<div class="scan-btns"><button class="btn primary" data-act="scan">Scan a code</button><button class="btn" data-act="scan-photo">Use a photo</button></div>' +
    '<form data-form="manual" class="code-entry"><label for="f-code" class="ce-label">Camera not working? Type the name under the QR</label>' +
    '<div class="ce-right"><input type="text" id="f-code" maxlength="40" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="ex. purple-ponies" aria-label="Name under the QR"><button class="btn" type="submit">Open</button></div></form></div>';
  return out + '</section>';
}

/* Final standings: most treats first. Guests who never scanned a code get a dash. */
function leaderboardHTML(h, me){
  var gm = guestsById(), seen = {};
  var rows = h.leaderboard.filter(function(r){ return gm[r.guest_id]; }).map(function(r){ seen[r.guest_id] = true; return {g: gm[r.guest_id], pts: r.points, finds: r.finds}; });
  var rest = S.state.guests.filter(function(g){ return !seen[g.id]; }).sort(function(a, b){ return a.name.localeCompare(b.name); });
  return '<section class="block"><h2>Leaderboard</h2><ol class="board">' + rows.map(function(r){
    return '<li class="' + (r.g.id === me.id ? 'me' : '') + '"><span>' + esc(fullName(r.g)) + ' <span class="muted small">\u00b7 ' + plural(r.finds, 'code') + ' found</span></span><span class="pts">' + plural(r.pts, 'treat') + '</span></li>';
  }).join('') + rest.map(function(g){
    return '<li class="none' + (g.id === me.id ? ' me' : '') + '"><span>' + esc(fullName(g)) + '</span><span class="pts">-</span></li>';
  }).join('') + '</ol></section>';
}

/* Your Haul: one tile per code you found. The front shows the code's name; tap to flip and see the trick or treat. */
function hauls(h, over){
  if (!h.mine.length) return '<p class="muted small">' + (over ? 'You didn\u2019t find any codes this time.' : 'Nothing yet. Find a code and scan it.') + '</p>';
  return '<div class="flips">' + h.mine.map(function(c){
    var open = S.flipped && S.flipped[c.code_id], trick = c.kind === 'trick';
    return '<button class="flip found ' + (trick ? 'trick' : 'treat') + (open ? ' open' : '') + '" data-act="flip" data-num="' + c.code_id + '" aria-pressed="' + !!open + '" aria-label="' + esc(c.name) + '">' +
      '<span class="face front"><b>' + esc(c.name).replace(/-/g, '<br>') + '</b><small>Tap to flip</small></span>' +
      '<span class="face back"><b>' + (trick ? 'Trick!' : 'Treat!') + '</b><small>' + esc(c.message || '') + '</small></span></button>';
  }).join('') + '</div>';
}

function viewerView(){

    (S.isHost && !mine ? '<button class="btn danger small" data-act="host-del-photo" data-id="' + p.id + '">' + (armed('hdel-' + p.id) ? 'Tap again to confirm' : 'Remove (host)') + '</button>' : '') + '</div></div></div>';
}

/* ----- scan reveal ----- */
function revealView(){
  var r = S.reveal;
  if (r.phase === 'knock') return '<div class="reveal" role="dialog" aria-live="polite"><div class="box"><div class="door"></div><p class="msg">Knock, knock…</p></div></div>';
  var x = r.result, body = '';
  if (x.status === 'ok' || x.status === 'already') {
    var trick = x.kind === 'trick';
    body = (x.status === 'already' ? '<span class="eyebrow">You already opened this one</span>' : '') +
      '<div class="word ' + (trick ? 'trick' : 'treat') + ' pop">' + (trick ? 'Trick!' : 'Treat!') + '</div>' +
      (x.message ? '<p class="msg">' + esc(x.message) + '</p>' : '') +
      (x.status === 'ok' ? '<p class="muted small">' + (trick ? 'No points for a trick.' : 'That\u2019s 1 point.') + ' ' +
        (x.hunt_over ? 'That was the last code. The hunt is over!' : plural(x.codes_left, 'code') + ' still hidden.') + '</p>' : '');
  } else {
    var msgs = {
      taken: ['Too late!', 'This code has been scanned already. Keep looking.'],
      closed: huntOver() ? ['Hunt over', 'The hunt has ended, so this one stays unopened.'] : ['Not yet', 'The hunt hasn\u2019t started. Remember where this one is.'],
      unknown: ['Hmm', 'That code doesn\u2019t belong to this party.']
    }[x.status] || ['Hmm', 'Something odd happened. Try again.'];
    body = '<div class="word pop" style="font-size:52px">' + msgs[0] + '</div><p class="msg">' + msgs[1] + '</p>';
  }
  return '<div class="reveal" role="dialog" aria-live="polite"><div class="box">' + body + '<div class="btns" style="justify-content:center"><button class="btn primary" data-act="close-reveal">Back to the hunt</button></div></div></div>';
}

/* ----- pop-up guest list (costume groups and drink teams) ----- */
function sheetRows(){
  var sh = S.sheet, me = S.state.me, gm = guestsById(), tm = teamsById(), mine = gm[me.id] || me;
  var q = (sh.q || '').trim().toLowerCase();
  var list = S.state.guests.filter(function(g){
    return !q || (g.name + ' ' + (g.nickname || '')).toLowerCase().indexOf(q) > -1;
  }).sort(function(a, b){ return a.name.localeCompare(b.name); });
  if (!list.length) return '<p class="muted small" style="padding:14px 0">' + (q ? 'No one by that name yet.' : 'No one else has joined yet.') + '</p>';
  return list.map(function(g){
    var state, note = '';
    if (g.id === me.id) { state = 'taken'; note = 'Can\u2019t add yourself'; }
    else if (sh.kind === 'group') {
      if (mine.group_id && g.group_id === mine.group_id) state = 'in';
      else if (g.group_id) { state = 'taken'; note = 'In a group with ' + joinNames(groupOf(g).filter(function(x){ return x.id !== g.id; }).map(shortName)); }
      else state = 'free';
    } else {
      if (g.team_id && g.team_id === mine.team_id) state = 'in';
      else if (g.team_id) { state = 'taken'; note = 'On ' + (tm[g.team_id] ? tm[g.team_id].name : 'another team'); }
      else state = 'free';
    }
    return '<button class="srow ' + state + '" data-act="sheet-toggle" data-id="' + g.id + '"' + (state === 'taken' || S.busy.sheet ? ' disabled' : '') + ' aria-pressed="' + (state === 'in') + '">' +
      '<span class="nm">' + esc(fullName(g)) + (note ? '<span class="muted small">' + esc(note) + '</span>' : '') + '</span>' +
      '<span class="tick">' + (state === 'in' ? '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' : state === 'free' ? '+' : '') + '</span></button>';
  }).join('');
}
function sheetView(){
  var sh = S.sheet, group = sh.kind === 'group';
  return '<div class="sheet" role="dialog" aria-label="' + (group ? 'Couples / Group Costume' : 'Add Teammates') + '"><div class="sheet-in">' +
    '<div class="overlay-top"><h3>' + (group ? 'Couples / Group Costume' : 'Add Teammates') + '</h3><button class="btn small ghost" data-act="sheet-close">Done</button></div>' +
    '<p class="muted small">' + (group ? 'Tap the people in your costume. Tap again to take them out. It updates on their phones too.' : 'Tap people to add them to your team. Tap again to take them off.') + '</p>' +
    '<input type="search" id="f-sheetq" placeholder="Search guests" autocomplete="off" value="' + esc(sh.q || '') + '">' +
    '<div class="slist" id="sheet-list">' + sheetRows() + '</div></div></div>';
}

/* ---------- countdown ticker ---------- */
function tick(){
  var t = now();
  document.querySelectorAll('[data-cdp]').forEach(function(el){
    var html = dstParts(+el.getAttribute('data-cdp') - t);
    if (el.innerHTML !== html) el.innerHTML = html;
  });
  document.querySelectorAll('[data-cd]').forEach(function(el){
    var target = +el.getAttribute('data-cd'), d = target - t;
    el.textContent = d > 0 ? fmtDur(d, el.hasAttribute('data-secs')) : (el.getAttribute('data-done') || '');
  });
}
setInterval(tick, 1000);

/* ---------- actions ---------- */
function busy(key, on){ S.busy[key] = on; }
function act(key, promise, okMsg){
  busy(key, true); render(true);
  return promise.then(function(r){ if (okMsg) toast(okMsg); return refresh().then(function(){ return r; }); })
    .catch(function(e){ toast(e.message, true); })
    .then(function(r){ busy(key, false); render(true); return r; });
}
function val(id){ var el = document.getElementById(id); return el ? el.value : ''; }

app.addEventListener('submit', function(e){
  var form = e.target.closest('form'); if (!form) return;
  e.preventDefault();
  var kind = form.getAttribute('data-form');
  if (kind === 'gate') {
    var pass = val('f-pass').trim(); if (!pass) return;
    busy('gate', true); render(true);
    sb && rpc('party_check', {p_pass: pass}).then(function(r){
      S.pass = pass; S.isHost = !!r.host; store.set('wake-pass', pass);
      return refresh();
    }).catch(function(err){ toast(err.message, true); }).then(function(){ busy('gate', false); render(true); });
  }
  if (kind === 'join' || kind === 'signin') {
    var name = val('f-name').trim(), pin = val('f-pin').trim();
    if (!/^\d{4}$/.test(pin)) { toast(ERR.bad_pin, true); return; }
    busy('join', true); render(true);
    var p = kind === 'join' ? rpc('party_join', {p_pass: S.pass, p_name: name, p_nickname: val('f-nick').trim() || null, p_pin: pin})
                           : rpc('party_signin', {p_pass: S.pass, p_name: name, p_pin: pin});
    p.then(function(r){ S.token = r.token; store.set('wake-token', r.token); S.ballots = {costume: null, drink: null}; S.tab = 'home'; return refresh(); })
     .catch(function(err){ toast(err.message, true); }).then(function(){ busy('join', false); render(true); });
  }
  if (kind === 'profile') {
    var np = val('f-ppin').trim();
    if (np && !/^\d{4}$/.test(np)) { toast(ERR.bad_pin, true); return; }
    act('me', rpc('party_update_profile', {p_pass: S.pass, p_token: S.token, p_name: val('f-pname').trim(), p_nickname: val('f-pnick').trim() || null, p_new_pin: np || null}).then(function(){ var p = document.getElementById('f-ppin'); if (p) p.value = ''; }), 'Saved');
  }
  if (kind === 'me') act('me', rpc('party_update_me', {p_pass: S.pass, p_token: S.token, p_nickname: val('f-nick2').trim() || null, p_costume_title: val('f-title').trim() || null}), 'Saved');
  if (kind === 'team') act('team', rpc('party_update_team', {p_pass: S.pass, p_token: S.token, p_name: val('f-tname').trim(), p_drink_name: val('f-dname').trim() || null}), 'Team saved');
  if (kind === 'newteam') { var tn = val('f-newteam').trim(); if (tn) act('team', rpc('party_create_team', {p_pass: S.pass, p_token: S.token, p_name: tn}), 'Team started'); }
  if (kind === 'manual') {
    var code = val('f-code').toLowerCase().replace(/[^0-9a-z]/g, '');
    if (code) { var fc = document.getElementById('f-code'); fc.value = ''; fc.blur(); claimCode(code); }
  }
  if (kind === 'texts') {
    var tx = {};
    TEXTS.forEach(function(t){ var v = val('tx-' + t[0]).trim(); if (v) tx[t[0]] = v; });
    act('host', rpc('host_update_config', {p_pass: S.pass, p_patch: {texts: tx}}).then(refreshHost), 'Page text saved');
    return;
  }
  if (kind === 'alert-edit') {
    var et = val('f-alert-edit').trim(), eat = form.getAttribute('data-at');
    if (!et) { toast('An announcement can\u2019t be empty. Use Remove instead.', true); return; }
    var list = (S.host.config.alerts || []).map(function(x){ return x.at === eat ? {text: et, at: x.at} : x; }), pe = {alerts: list};
    if (S.host.config.alert && S.host.config.alert.at === eat) pe.alert = {text: et, at: eat};
    act('host', rpc('host_update_config', {p_pass: S.pass, p_patch: pe}).then(function(){ S.editAlert = null; return refreshHost(); }), 'Announcement updated');
    return;
  }
  if (kind === 'alert') {
    var at = val('f-alert').trim(); if (!at) { toast('Write the announcement first.', true); return; }
    var post = {text: at, at: new Date().toISOString()};
    var hist = [post].concat((S.host.config.alerts || []).filter(function(x){ return x && x.text; })).slice(0, 12);
    act('host', rpc('host_update_config', {p_pass: S.pass, p_patch: {alert: post, alerts: hist}}).then(function(){ var f = document.getElementById('f-alert'); if (f) f.value = ''; return refreshHost(); }), 'Announcement posted');
  }
  if (kind === 'message') {
    var body = val('f-msg').trim();
    if (!body) { toast('Write a message first.', true); return; }
    act('msg', rpc('party_post_message', {p_pass: S.pass, p_token: S.token, p_body: body}).then(function(){ var f = document.getElementById('f-msg'); if (f) f.value = ''; var c = document.getElementById('msg-count'); if (c) c.textContent = '0/60'; }), 'Posted');
  }
  if (kind === 'passcodes') {
    var ng = val('f-newguest').trim(), nh = val('f-newhost').trim();
    if (!ng && !nh) { toast('Type a new passcode first.', true); return; }
    if (!armed('passcodes')) { arm('passcodes'); return; }
    S.confirm = null;
    act('host', rpc('host_change_passcodes', {p_pass: S.pass, p_new_guest: ng || null, p_new_host: nh || null}).then(function(){
      if (nh) { S.pass = nh; store.set('wake-pass', nh); }
      ['f-newguest', 'f-newhost'].forEach(function(i){ var f = document.getElementById(i); if (f) f.value = ''; });
      return refreshHost();
    }), 'Passcodes changed');
  }
  if (kind === 'code') {
    var fd = new FormData(form);
    act('host', rpc('host_save_code', {p_pass: S.pass, p_id: +form.getAttribute('data-id'), p_label: fd.get('label'), p_kind: fd.get('kind'),
      p_message: fd.get('message')}).then(refreshHost), 'Code saved');
  }
  if (kind === 'schedule') {
    var rows = S.hostSchedule.map(function(r){ return {at: r.at, title: r.title}; }).filter(function(r){ return r.title && !isNaN(Date.parse(r.at)); });
    rows.sort(function(a, b){ return Date.parse(a.at) - Date.parse(b.at); });
    act('host', rpc('host_update_config', {p_pass: S.pass, p_patch: {schedule: rows}}).then(function(){ S.hostSchedule = null; return refreshHost(); }), 'Schedule saved');
  }
  if (kind === 'info') {
    var pl = val('f-playlist').trim();
    if (pl && !/^https?:\/\//.test(pl)) { toast('The playlist link should start with https://', true); return; }
    act('host', rpc('host_update_config', {p_pass: S.pass, p_patch: {playlist_url: pl}}).then(refreshHost), 'Playlist saved');
  }
  if (kind === 'wipe') {
    if (val('f-wipe').trim() !== 'DELETE') { toast('Type DELETE in capitals to confirm.', true); return; }
    act('host', rpc('host_reset', {p_pass: S.pass, p_what: 'everything'}).then(refreshHost), 'Everything deleted');
  }
});

app.addEventListener('input', function(e){
  var t = e.target;
  if (t.id === 'f-msg') { var mc = document.getElementById('msg-count'); if (mc) mc.textContent = t.value.length + '/60'; return; }
  if (t.id === 'f-sheetq' && S.sheet) { S.sheet.q = t.value; var l = document.getElementById('sheet-list'); if (l) l.innerHTML = sheetRows(); return; }
  if (t.hasAttribute('data-sch')) {
    var row = S.hostSchedule[+t.getAttribute('data-sch')], f = t.getAttribute('data-field');
    if (f === 'at') { var d = new Date(t.value); if (!isNaN(d)) row.at = d.toISOString(); }
    else row.title = t.value;
  }
});

/* Photo picking. The page redraws every few seconds, and a phone's photo picker can stay open much longer,
   so the file input lives outside the redrawn area and keeps working however long someone takes. */
var picker = document.getElementById('picker'), pickFor = null, pickCaption = null;
function openPicker(which){
  pickFor = which;
  pickCaption = which === 'album' ? (val('f-caption').trim() || null) : null;
  picker.multiple = which === 'album';
  picker.value = '';
  picker.click();
}
/* GIFs are uploaded as they are, so they keep moving. Everything else is shrunk to a JPEG. */
var GIF_MAX = 1450000;
function isGif(f){ return f && (f.type === 'image/gif' || /\.gif$/i.test(f.name || '')); }
function readGif(f){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onload = function(){ var d = String(r.result).replace(/^data:[^;,]*/, 'data:image/gif'); if (d.length > GIF_MAX) rej(new AppError('gif_too_big')); else res(d); };
    r.onerror = function(){ rej(new AppError('bad_image')); };
    r.readAsDataURL(f);
  });
}
function prep(file, maxDim, q, maxLen){ return isGif(file) ? readGif(file) : shrink(file, maxDim, q, maxLen); }
picker.addEventListener('change', function(){
  var which = pickFor, t = picker;
  if (!which || !t.files || !t.files.length) return;
  var files = Array.prototype.slice.call(t.files);
  t.value = '';
  if (which === 'costume' || which === 'team') {
    toast('Uploading…');
    prep(files[0], 720, 0.8, 380000).then(function(d){
      return act('photo', rpc(which === 'costume' ? 'party_set_costume_photo' : 'party_set_team_photo', {p_pass: S.pass, p_token: S.token, p_photo: d}), 'Photo saved');
    }).catch(function(err){ toast(err.message || ERR.bad_image, true); });
  }
  if (which === 'album') {
    var caption = val('f-caption').trim() || pickCaption, done = 0;
    busy('upload', true);
    var next = function(i){
      if (i >= files.length) return Promise.resolve();
      S.uploadMsg = 'Uploading ' + (i + 1) + ' of ' + files.length + '…'; render(true);
      return (isGif(files[i]) ? readGif(files[i]).then(function(g){ return [g, g]; }) : Promise.all([shrink(files[i], 1400, 0.8, 700000), shrink(files[i], 420, 0.72, 150000)])).then(function(r){
        return rpc('party_add_photo', {p_pass: S.pass, p_token: S.token, p_caption: caption, p_thumb: r[1], p_full: r[0]}).then(function(id){
          imgCache.set(imgKey('photo', id, 'p', 'thumb'), r[1]); imgCache.set(imgKey('photo', id, 'p', 'full'), r[0]); done++;
        });
      }).catch(function(err){ toast(err.message, true); if (err.code === 'photo_limit' || err.code === 'network') throw err; }).then(function(){ return next(i + 1); });
    };
    next(0).catch(function(){}).then(function(){
      busy('upload', false);
      var c = document.getElementById('f-caption'); if (c) c.value = '';
      if (done) toast(done === 1 ? 'Photo added' : done + ' photos added');
      return refresh();
    }).then(function(){ render(true); });
  }
});

app.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  var a = b.getAttribute('data-act'), id = +b.getAttribute('data-id');
  switch (a) {
    case 'retry': S.fatal = null; init(); break;
    case 'flip': { var fn = b.getAttribute('data-num'); S.flipped = S.flipped || {}; S.flipped[fn] = !S.flipped[fn]; b.classList.toggle('open', S.flipped[fn]); b.setAttribute('aria-pressed', S.flipped[fn]); break; }
    case 'board': S.overlay = 'board'; S.boardTab = 'all'; render(true); window.scrollTo(0, 0); break;
    case 'board-tab': S.boardTab = b.getAttribute('data-tab'); render(true); break;
    case 'del-msg': if (!armed('msg-' + id)) { arm('msg-' + id); break; } S.confirm = null; act('msg', rpc('party_delete_message', {p_pass: S.pass, p_token: S.token, p_id: id}), 'Message deleted'); break;
    case 'host-del-msg': if (!armed('hmsg-' + id)) { arm('hmsg-' + id); break; } S.confirm = null; act('msg', rpc('host_delete_message', {p_pass: S.pass, p_id: id}), 'Message removed'); break;
    case 'alert-dismiss': store.set('wake-alert-seen', b.getAttribute('data-at')); render(true); break;
    case 'alert-edit': S.editAlert = b.getAttribute('data-at'); render(true); var fe = document.getElementById('f-alert-edit'); if (fe) fe.focus(); break;
    case 'alert-edit-cancel': S.editAlert = null; render(true); break;
    case 'alert-del': {
      var at2 = b.getAttribute('data-at');
      if (!armed('al-' + at2)) { arm('al-' + at2); break; } S.confirm = null;
      var left = (S.host.config.alerts || []).filter(function(x){ return x.at !== at2; }), p2 = {alerts: left};
      if (S.host.config.alert && S.host.config.alert.at === at2) p2.alert = null;
      act('host', rpc('host_update_config', {p_pass: S.pass, p_patch: p2}).then(refreshHost), 'Announcement removed'); break;
    }
    case 'alert-clear': act('host', rpc('host_update_config', {p_pass: S.pass, p_patch: {alert: null}}).then(refreshHost), 'Announcement cleared'); break;
    case 'pick': openPicker(b.getAttribute('data-pick')); break;
    case 'scan': openScanner(); break;
    case 'scan-photo': qrPicker.value = ''; qrPicker.click(); break;
    case 'about': S.overlay = 'about'; render(true); window.scrollTo(0, 0); break;
    case 'info': S.overlay = 'info'; render(true); window.scrollTo(0, 0); break;
    case 'no-playlist': toast('The playlist isn\u2019t up yet. Check back soon.'); break;
    case 'close-overlay': S.overlay = null; S.hostSchedule = null; render(true); window.scrollTo(0, 0); break;
    case 'authmode': S.authMode = S.authMode === 'join' ? 'signin' : 'join'; render(true); break;
    case 'tab': S.tab = b.getAttribute('data-tab'); render(true); window.scrollTo(0, 0); break;
    case 'signout': if (!armed('signout')) { arm('signout'); break; } S.confirm = null; forgetMe(); S.state = null; refresh(); render(true); break;
    case 'rank': {
      var kind = b.getAttribute('data-kind'), bal = S.ballots[kind] = (S.ballots[kind] || []).slice(), pos = bal.indexOf(id);
      if (pos > -1) bal.splice(pos, 1);
      else if (bal.length >= 3) { toast('You’ve picked three. Tap one to remove it first.'); break; }
      else bal.push(id);
      S.ballots[kind] = bal; S.keepScroll = true; render(true); break;
    }
    case 'cast': {
      var k2 = b.getAttribute('data-kind');
      act('cast-' + k2, rpc(k2 === 'costume' ? 'party_vote_costume' : 'party_vote_drink', {p_pass: S.pass, p_token: S.token, p_picks: S.ballots[k2]}), 'Vote counted');
      break;
    }
    case 'profile': S.overlay = 'profile'; render(true); window.scrollTo(0, 0); break;
    case 'sheet': S.sheet = {kind: b.getAttribute('data-kind'), q: ''}; render(true); break;
    case 'sheet-close': S.sheet = null; render(true); break;
    case 'sheet-toggle': {
      var fn = S.sheet.kind === 'group' ? 'party_toggle_group' : 'party_toggle_teammate';
      act('sheet', rpc(fn, {p_pass: S.pass, p_token: S.token, p_other: id}).then(function(){ S.ballots.costume = null; S.ballots.drink = null; }));
      break;
    }
    case 'rm-costume-photo': act('photo', rpc('party_set_costume_photo', {p_pass: S.pass, p_token: S.token, p_photo: null}), 'Photo removed'); break;
    case 'join-team': act('team', rpc('party_join_team', {p_pass: S.pass, p_token: S.token, p_team: id}).then(function(){ S.ballots.drink = null; }), 'Welcome to the team'); break;
    case 'leave-team': if (!armed('leave')) { arm('leave'); break; } S.confirm = null; act('team', rpc('party_join_team', {p_pass: S.pass, p_token: S.token, p_team: null}), 'You left the team'); break;
    case 'view': S.viewer = id; render(true); break;
    case 'close-viewer': S.viewer = null; render(true); break;
    case 'prev-photo': case 'next-photo': {
      var ph = S.state.photos, i = ph.findIndex(function(x){ return x.id === S.viewer; }) + (a === 'next-photo' ? 1 : -1);
      if (ph[i]) { S.viewer = ph[i].id; render(true); } break;
    }
    case 'download': getFull(id).then(function(s){ if (s) saveBlob(dataUrlToBlob(s), 'wake-all-night-' + id + (/^data:image\/gif/.test(s) ? '.gif' : '.jpg')); }).catch(function(err){ toast(err.message, true); }); break;
    case 'del-photo': if (!armed('del-' + id)) { arm('del-' + id); break; } S.confirm = null; S.viewer = null; act('photo', rpc('party_delete_photo', {p_pass: S.pass, p_token: S.token, p_id: id}), 'Photo removed'); break;
    case 'host-del-photo': if (!armed('hdel-' + id)) { arm('hdel-' + id); break; } S.confirm = null; S.viewer = null; act('photo', rpc('host_delete_photo', {p_pass: S.pass, p_id: id}), 'Photo removed'); break;
    case 'zip': downloadAll(); break;
    case 'close-reveal': S.reveal = null; if (b.getAttribute('data-tab')) S.tab = b.getAttribute('data-tab'); render(true); window.scrollTo(0, 0); break;
    case 'open-host': S.overlay = 'host'; render(true); window.scrollTo(0, 0); refreshHost(); break;
    case 'htab': S.hostTab = b.getAttribute('data-tab'); S.hostSchedule = null; render(true); break;
    case 'cfg': {
      var key = b.getAttribute('data-key'), v2 = JSON.parse(b.getAttribute('data-val')), patch = {}; patch[key] = v2;
      if (v2 === true) { if (key === 'announce_costume') patch.costume_voting = 'closed'; if (key === 'announce_drink') patch.drink_voting = 'closed'; }
      act('host', rpc('host_update_config', {p_pass: S.pass, p_patch: patch}).then(refreshHost)); break;
    }
    case 'phase': {
      var v = b.getAttribute('data-val');
      if (v === 'ended' && !armed('end')) { arm('end'); break; }
      S.confirm = null;
      var pt = {phase: v}; if (v === 'ended') { pt.costume_voting = 'closed'; pt.drink_voting = 'closed'; pt.hunt = 'closed'; }
      act('host', rpc('host_update_config', {p_pass: S.pass, p_patch: pt}).then(refreshHost), v === 'ended' ? 'The night has ended' : 'Party reopened'); break;
    }
    case 'reset': { var w = b.getAttribute('data-what'); if (!armed('reset-' + w)) { arm('reset-' + w); break; } S.confirm = null; act('host', rpc('host_reset', {p_pass: S.pass, p_what: w}).then(refreshHost), 'Cleared'); break; }
    case 'add-code': act('host', rpc('host_add_code', {p_pass: S.pass}).then(refreshHost), 'Code added'); break;
    case 'del-code': if (!armed('code-' + id)) { arm('code-' + id); break; } S.confirm = null; act('host', rpc('host_delete_code', {p_pass: S.pass, p_id: id}).then(refreshHost), 'Code deleted'); break;
    case 'print': S.overlay = 'print'; render(true); window.scrollTo(0, 0); break;
    case 'do-print': window.print(); break;
    case 'sch-add': { var last = S.hostSchedule[S.hostSchedule.length - 1]; S.hostSchedule.push({at: last ? new Date(Date.parse(last.at) + 1800000).toISOString() : new Date().toISOString(), title: ''}); render(true); break; }
    case 'sch-del': S.hostSchedule.splice(+b.getAttribute('data-i'), 1); render(true); break;
    case 'del-guest': if (!armed('guest-' + id)) { arm('guest-' + id); break; } S.confirm = null; act('host', rpc('host_delete_guest', {p_pass: S.pass, p_id: id}).then(refreshHost), 'Guest removed'); break;
    case 'del-team': if (!armed('team-' + id)) { arm('team-' + id); break; } S.confirm = null; act('host', rpc('host_delete_team', {p_pass: S.pass, p_id: id}).then(refreshHost), 'Team removed'); break;
    case 'reset-pin': {
      var pin = String(Math.floor(1000 + Math.random() * 9000));
      act('host', rpc('host_reset_pin', {p_pass: S.pass, p_id: id, p_pin: pin}).then(function(){ toast('New PIN for ' + shortName(guestsById()[id]) + ': ' + pin, false, 12000); }));
      break;
    }
  }
});

function downloadAll(){
  if (!window.JSZip) { toast('The download tool didn’t load. Check your connection.', true); return; }
  var ph = S.state.photos.slice().reverse(), gm = guestsById(), zip = new JSZip(), i = 0;
  busy('zip', true);
  var step = function(){
    if (i >= ph.length) return Promise.resolve();
    var chunk = ph.slice(i, i + 4); i += chunk.length;
    S.zipMsg = 'Gathering ' + Math.min(i, ph.length) + ' of ' + ph.length + '…'; render(true);
    return rpc('party_images', {p_pass: S.pass, p_kind: 'photo', p_ids: chunk.map(function(p){ return p.id; }), p_size: 'full'}).then(function(m){
      chunk.forEach(function(p, j){
        var src = m[String(p.id)]; if (!src) return;
        var d = new Date(Date.parse(p.at)), who = shortName(gm[p.guest_id]).replace(/[^a-z0-9]+/gi, '-').toLowerCase();
        zip.file(String(i - chunk.length + j + 1).padStart(3, '0') + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '-' + who + (/^data:image\/gif/.test(src) ? '.gif' : '.jpg'), src.split(',')[1], {base64: true});
      });
      return step();
    });
  };
  step().then(function(){ S.zipMsg = 'Zipping…'; render(true); return zip.generateAsync({type: 'blob'}); })
    .then(function(blob){ saveBlob(blob, 'a-wake-all-night-photos.zip'); toast('Download started'); })
    .catch(function(err){ toast(err.message || 'Download failed. Try again.', true); })
    .then(function(){ busy('zip', false); render(true); });
}

/* ---------- start ---------- */
function init(){
  if (!configured()) { render(true); return; }
  if (!window.supabase || !window.supabase.createClient) { S.fatal = 'The page couldn’t load everything it needs. Check your connection and reload.'; render(true); return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {auth: {persistSession: false, autoRefreshToken: false, detectSessionInUrl: false}});
  if (!S.pass) { render(true); return; }
  render(true);
  rpc('party_check', {p_pass: S.pass}).then(function(r){ S.isHost = !!r.host; S.fatal = null; return refresh(); })
    .catch(function(e){ if (e.code === 'network') S.fatal = ERR.network; render(true); });
}
setInterval(function(){
  if (document.visibilityState !== 'visible' || !S.pass || !S.state) return;
  refresh();
  if (S.overlay === 'host') refreshHost();
}, 8000);
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && S.pass && S.state) refresh(); });
window.addEventListener('hashchange', function(){
  var m = location.hash.match(/^#c=([0-9a-zA-Z-]+)$/);
  if (m) { try { history.replaceState(null, '', location.pathname); } catch(e){} if (S.state && S.state.me) claimCode(m[1].toLowerCase()); else { try { sessionStorage.setItem('wake-pending', m[1].toLowerCase()); } catch(e){} } }
});
init();
})();
</script>
